paths:
  personalProjects: "~/Projects/Personal"
  workProjects: "~/Projects/Work"

git:
  defaultIdentity: personal
  personal:
    name: "Your Name"
    email: "personal@example.com"
  # Optional second profile. If omitted, the personal profile is used
  # everywhere.
  work:
    name: "Your Name"
    email: "work@example.com"

shell:
  enableGoenv: true
  enableFnm: true
  enableZoxide: true
