#
# Tmux Gruvbox theme using the standard Gruvbox dark palette
#

# window separators
set-option -wg window-status-separator ""

# monitor window changes
set-option -wg monitor-activity on
set-option -wg monitor-bell on

# status refresh
set-option -g status-interval 1

# copy/mode colors
set-option -wg mode-style bg="#504945",fg="#ebdbb2"

# base status bar
set-option -g status-style bg="#3c3836",fg="#a89984"

# inactive windows
set-option -wg window-status-style bg="#3c3836",fg="#a89984"

# activity and bell states
set-option -wg window-status-activity-style bg="#fabd2f",fg="#282828",bold
set-option -wg window-status-bell-style bg="#ff5f5f",fg="#282828",bold

# active window
set-option -wg window-status-current-style bg="#83a598",fg="#282828",bold

# Window status alignment
set -g status-justify centre

# pane borders
set-option -g pane-active-border-style fg="#83a598"
set-option -g pane-border-style fg="#504945"

# messages
set-option -g message-style bg="#504945",fg="#ebdbb2"
set-option -g message-command-style bg="#665c54",fg="#fbf1c7"

# pane number display
set-option -g display-panes-active-colour "#fe8019"
set-option -g display-panes-colour "#fabd2f"

# clock
set-option -wg clock-mode-colour "#83a598"

# copy mode highlighting
%if #{>=:#{version},3.2}
    set-option -wg copy-mode-match-style "bg=#fabd2f,fg=#282828"
    set-option -wg copy-mode-current-match-style "bg=#fe8019,fg=#282828"
%endif

# statusbar formatting
set -g status-left-length 40
set -g status-left "#[bg=#83a598,fg=#282828,bold] #S #[bg=#665c54,fg=#ebdbb2] #(whoami) #[bg=#504945,fg=#d5c4a1] #I:#P "
set -g status-right-length 150
set -g status-right "#[bg=#504945,fg=#d5c4a1] %H:%M #[bg=#665c54,fg=#ebdbb2] %d.%b.%Y #[bg=#83a598,fg=#282828,bold] @#H "
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
